name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Locate, Prepare, and Build Android App
      run: |
        # 🔍 Dynamically search the entire repository for the gradlew script
        GRADLEW_PATH=$(find . -name "gradlew" -print -quit)
        
        if [ -z "$GRADLEW_PATH" ]; then
          echo "❌ ERROR: 'gradlew' script could not be found anywhere in this repository."
          echo "Please ensure you have fully committed and pushed your Android Studio project files."
          exit 1
        fi
        
        # Extract the directory where the project actually lives
        PROJECT_ROOT=$(dirname "$GRADLEW_PATH")
        echo "✅ Found gradlew at: $GRADLEW_PATH"
        echo "📂 Stepping inside directory: $PROJECT_ROOT"
        cd "$PROJECT_ROOT"
        
        # Grant executable permissions to the wrapper dynamically
        chmod +x gradlew
        
        # 🔑 Create the dummy debug keystore that your build.gradle is looking for
        echo "🔑 Generating temporary debug keystore..."
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        
        # 🚀 Compile the application
        echo "🚀 Launching Gradle compilation..."
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Age-Calculator-Debug-APK
        path: "**/build/outputs/apk/debug/*-debug.apk"
